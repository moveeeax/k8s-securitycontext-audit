name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go: ["1.22.x", "1.23.x"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race ./...
      - name: Build
        run: go build ./...

  self-audit:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
      - name: Build binary
        run: go build -o k8s-securitycontext-audit .
      - name: Audit example manifests (must find high-severity gaps)
        run: |
          set +e
          ./k8s-securitycontext-audit audit examples/insecure-deployment.yaml --fail-on high
          code=$?
          set -e
          if [ "$code" -ne 1 ]; then
            echo "expected exit 1 from insecure example, got $code"
            exit 1
          fi
      - name: Audit hardened example (must pass)
        run: ./k8s-securitycontext-audit audit examples/hardened-pod.yaml --fail-on low
